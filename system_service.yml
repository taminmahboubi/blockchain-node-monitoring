---
- name: Ensure node service configuration
  hosts: all
  tasks:        
    - name: Copy blockchain-node.service to remote nodes
      copy:
        src: blockchain-node.service  # <-- Use the actual file name
        dest: /etc/systemd/system/blockchain-node.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart node service

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart node service
      systemd:
        name: blockchain-node
        state: restarted
        enabled: yes
